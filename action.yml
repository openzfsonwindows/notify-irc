name: 'Notify IRC Notifico'
description: 'Send a notification message to an IRC channel'
author: 'Andrew Wason'
inputs:
  server:
    description: 'IRC server, or a comma separated list tried in order until one delivers'
    default: 'irc.libera.chat'
    required: true
  timeout:
    description: 'Seconds allowed per server to connect and deliver'
    default: 15
    required: false
  only_repository:
    description: 'Comma separated owner/repo patterns (fnmatch). Do nothing on any other repository, so forks that copy the workflow stay quiet'
    required: false
  github_token:
    description: 'Token used to count the commits of large pushes (GitHub truncates the event to 20)'
    default: ${{ github.token }}
    required: false
  port:
    description: 'IRC server port'
    default: 6697
    required: true
  password:
    description: 'IRC server password'
    required: false
  channel:
    description: 'IRC channel to message'
    required: true
  channel_key:
    description: 'IRC channel password'
    required: false
  nickname:
    description: 'IRC user nickname'
    required: true
  sasl_password:
    description: 'IRC user SASL password'
    required: false
  eventpath:
    description: 'path to EVENT_FILE'
    required: true
  notice:
    description: 'Use NOTICE instead of PRIVMSG'
    default: false
    required: false
  tls:
    description: 'Connect to server using TLS'
    default: true
    required: false
  verbose:
    description: 'Enable verbose logging'
    default: false
    required: false
  ansicolor:
    description: 'Enable ansi color text'
    default: false
    required: false
  mirccolor:
    description: 'Enable mirc color text'
    default: false
    required: false
runs:
  using: 'docker'
  image: 'Dockerfile'
branding:
  icon: 'message-square'
  color: 'yellow'
